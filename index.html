<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidya Achievers Results</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
    .box { max-width: 450px; width: 100%; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 6px solid #063970; text-align: center; margin-top: 30px; box-sizing: border-box; }
    h2 { color: #063970; margin: 10px 0 5px 0; font-size: 22px; }
    .logo { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; }
    input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: center; }
    button { background: #063970; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 95%; font-weight: bold; margin-top: 10px; }
    .error { color: red; font-weight: bold; margin-top: 15px; display: none; background: #ffe6e6; padding: 8px; border-radius: 4px; }
    .report-card { border: 3px double #000; padding: 20px; background: white; text-align: left; }
    .sheet-title { text-align: center; font-weight: bold; font-size: 16px; margin-bottom: 15px; text-decoration: underline; }
    .info-table, .marks-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 14px; }
    .info-table td { padding: 5px 0; border-bottom: 1px dashed #eee; }
    .marks-table th, .marks-table td { border: 1px solid #000; padding: 8px; text-align: center; }
    .marks-table th { background: #f2f2f2; }
    .remarks-text { font-weight: bold; margin-top: 15px; padding: 10px; border: 1px solid #000; background: #f9f9f9; font-size: 13px; line-height: 1.6; }
    .punish { margin-top: 8px; color: #b91c1c; }
    .topper { margin-top: 8px; color: #b45309; }
    @media print {
      body { background: white; padding: 0; }
      #loginPage, .no-print { display: none !important; }
      .box { box-shadow: none; border-top: none; margin-top: 0; max-width: 100% !important; padding: 0; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
